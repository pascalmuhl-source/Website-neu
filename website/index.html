    <!-- Strukturierte Daten: Standort verankert die lokale Sichtbarkeit,
         areaServed sagt Google zugleich, dass bundesweit gearbeitet wird.
         sameAs verknüpft das Google-Unternehmensprofil — Adresse/Telefon hier
         müssen exakt mit dem Profil übereinstimmen, sonst erkennt Google die
         Zusammengehörigkeit nicht zuverlässig. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Pascal Webdesign",
      "description": "Webdesign für Sachverständige und Gutachter. Website-Erstellung, Redesign und laufende Betreuung.",
      "url": "https://pascal-webdesign.de/",
      "image": "https://pascal-webdesign.de/og-image.png",
      "telephone": "+491731043823",
      "email": "pascal@pascal-webdesign.de",
      "sameAs": [
        "https://share.google/AIW6wayHq9MifU8qP"
      ],
      "founder": {
        "@type": "Person",
        "name": "Pascal Muhl"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Ringstraße 2",
        "postalCode": "55452",
        "addressLocality": "Windesheim",
        "addressRegion": "Rheinland-Pfalz",
        "addressCountry": "DE"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Deutschland"
      },
      "knowsLanguage": "de",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Leistungen",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website-Erstellung" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Redesign bestehender Websites" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Wartung und Support" } }
        ]
      }
    }
    </script>

    <!-- Ohne JavaScript laufen die Reveal-Animationen nie an. Der prerenderte
         Inhalt ist da, also hier sichtbar schalten statt auf opacity:0 stehen lassen. -->
    <noscript>
      <style>
        .reveal { opacity: 1 !important; transform: none !important; }
        .line-inner { animation: none !important; }
        .nav-anim { opacity: 1 !important; transform: none !important; animation: none !important; }
      </style>
    </noscript>
