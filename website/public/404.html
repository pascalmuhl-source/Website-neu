<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Seite nicht gefunden — KONTUR</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    @font-face {
      font-family: 'Cormorant Garamond';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('/fonts/cormorant-garamond-latin-variable-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Archivo';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('/fonts/archivo-latin-variable.woff2') format('woff2');
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #F5F5F2;
      color: #1C1F1D;
      font-family: 'Archivo', -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
    }
    .nav {
      display: flex;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #DBDDD8;
    }
    .logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 21px;
      color: #1C1F1D;
      text-decoration: none;
    }
    .logo .dot { color: #147A55; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px 20px;
      max-width: 560px;
    }
    .code {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 84px;
      line-height: 1;
      color: #5B5F5B;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-size: 2rem;
      line-height: 1.15;
      margin: 0 0 16px;
    }
    p {
      font-size: 15.5px;
      line-height: 1.65;
      color: #5B5F5B;
      margin: 0 0 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      padding: 15px 28px;
      background: #1C1F1D;
      color: #F5F5F2;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: 1px solid #1C1F1D;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .btn:hover { background: transparent; color: #1C1F1D; }
    footer {
      padding: 26px 20px;
      border-top: 1px solid #DBDDD8;
      font-size: 12.5px;
      color: #5B5F5B;
    }
    footer a { color: #5B5F5B; margin-right: 20px; }
    @media (min-width: 880px) {
      .nav { padding: 20px 64px; }
      main { padding: 96px 64px; max-width: 720px; }
      .code { font-size: 120px; }
      h1 { font-size: 2.6rem; }
      footer { padding: 30px 64px; }
    }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/" class="logo">KONTUR<span class="dot">.</span></a>
  </div>

  <main>
    <div class="code">404</div>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>
      Der Link ist entweder veraltet oder enthält einen Tippfehler. Zurück zur Startseite
      findest du alles, was es hier gibt.
    </p>
    <a class="btn" href="/">Zur Startseite</a>
  </main>

  <footer>
    <a href="/impressum.html">Impressum</a>
    <a href="/datenschutz.html">Datenschutz</a>
  </footer>
</body>
</html>
